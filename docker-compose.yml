version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: teleport_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teleport
      POSTGRES_USER: teleport_user
      POSTGRES_PASSWORD: teleport_pass_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teleport_user -d teleport"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: teleport_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_pass_2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (будет добавлен позже)
  # api:
  #   build: ./backend
  #   container_name: teleport_api
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     - DB_HOST=postgres
  #     - DB_PORT=5432
  #     - DB_USER=teleport_user
  #     - DB_PASSWORD=teleport_pass_2024
  #     - DB_NAME=teleport
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #     - REDIS_PASSWORD=redis_pass_2024

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: teleport_network
